server {
    listen 80;
    server_name _;

    # Portal 总览页
    location / {
        root /app/portal;
        index index.html;
    }

    # 搜打撤游戏 - 静态文件
    location /sdc2/ {
        alias /app/games/sdc2/client/dist/;
        try_files $uri $uri/ /sdc2/index.html;
    }

    # 搜打撤游戏 - WebSocket 反代
    location /sdc2/socket.io/ {
        rewrite ^/sdc2/socket\.io/(.*) /socket.io/$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # 健康检查 (透传到 Node)
    location /health {
        proxy_pass http://127.0.0.1:3001;
    }
}
