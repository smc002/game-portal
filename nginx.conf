server {
    listen 80;
    server_name _;

    # Portal 总览页
    location / {
        root /app/portal;
        index index.html;
    }

    # 搜打撤游戏 - 静态文件
    location /sdc2/ {
        alias /app/games/sdc2/client/dist/;
        try_files $uri $uri/ /sdc2/index.html;
    }

    # 搜打撤游戏 - WebSocket 反代
    location /sdc2/socket.io/ {
        rewrite ^/sdc2/socket\.io/(.*) /socket.io/$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # 三国武将录 - 纯静态文件
    location /sanPal/ {
        alias /app/games/sanPal/dist/;
        try_files $uri $uri/ /sanPal/index.html;
    }

    # 天机盒 - 纯静态文件
    location /tianjiBox/ {
        alias /app/games/tianjiBox/client/dist/;
        try_files $uri $uri/ /tianjiBox/index.html;
    }

    # 杏林春满 - 纯静态文件（单HTML）
    location /zhongyi/ {
        alias /app/games/zhongyi/;
        try_files $uri $uri/ /zhongyi/game.html;
    }

    # 三国自走棋 - 纯静态文件
    location /rglike/ {
        alias /app/games/rglike/dist/;
        try_files $uri $uri/ /rglike/index.html;
    }

    # 超级自走三国 - 纯静态文件
    location /superAutoSan/ {
        alias /app/games/superAutoSan/dist/;
        try_files $uri $uri/ /superAutoSan/index.html;
    }

    # 健康检查 (透传到 Node)
    location /health {
        proxy_pass http://127.0.0.1:3001;
    }
}
